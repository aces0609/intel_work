# Job-board sources for hourly/touch-labor employers near the four east sites.
# Generated by live research 2026-10-19; every verified:true entry returned job data to a plain unauthenticated request (UA intel_work-research/0.1).
# total_postings_seen = company-wide count from the unfiltered live response (Workday may cap large boards at ~2000).
# 'Live local hits' in notes = result counts for that search term as of 2026-10-19; they are text/radius matches NOT filtered by state
# (e.g. Corinth, Florence, Savannah, Cumberland exist in several states), and Eightfold/Jibe location search is fuzzy/radius-based.
# platform 'other' entries carry vendor + exact request in config. Phenom and Oracle HCM keyword search is a text OR-match, so multiword city names over-match.
- company: Target
  platform: workday
  config:
    tenant: target
    wd: wd5
    site: targetcareers
  sites:
  - baltimore_md
  - st_augustine_fl
  search_terms:
    baltimore_md:
    - Baltimore
    - Sparrows Point
    - Dundalk
    - Essex
    st_augustine_fl:
    - St. Augustine
    - Saint Augustine
    - Jacksonville
    - Ponte Vedra
  verified: true
  total_postings_seen: 2000
  hourly_relevance: high
  careers_url: https://target.wd5.myworkdayjobs.com/targetcareers
  notes: 'Store team member, fulfillment, DC (flow) roles. Location is the store street address, e.g. ''3559 Boston
    Street, Baltimore,MD'' (Canton store). Live local hits (as of 2026-10-19): Baltimore=24, Sparrows Point=0, Dundalk=0,
    Essex=0, St. Augustine=8, Saint Augustine=8, Jacksonville=66, Ponte Vedra=0.'
- company: Lowe's
