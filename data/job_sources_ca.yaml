# Job-board sources for hourly "touch labor" near the four sites (palmdale_ca, redondo_beach_ca,
# sunnyvale_ca, san_diego_ca). Generated 2026-10-19 from live unauthenticated requests (User-Agent
# intel_work-research/0.1). Walmart, Home Depot and Amazon are intentionally absent (dedicated connectors).
#
# Field notes:
#  verified: true only if a live request to the board returned job data (a valid total/postings payload).
#  total_postings_seen: the largest total returned by any live query for that company (see the
#    "Live counts" list in notes). Free-text location search is fuzzy: Workday/Oracle/Phenom match the
#    string anywhere (Lancaster also matches Lancaster PA/NH, Sunnyvale matches Sunnyvale TX, Eightfold's
#    location filter behaved state-wide), so always post-filter on the parsed city/state of each posting.
#  platform "other": config.ats names the system and config.method/url/params/json is the exact request.
#  platform "unsupported": no usable unauthenticated JSON endpoint was demonstrated (reason in notes).

