- company: Kroger / Smith's Food & Drug (incl. Layton Dairy plant)
  platform: other
  config:
    type: oracle_candidate_experience
    host: eluq.fa.us2.oraclecloud.com
    site_number: CX_2001
    request: "GET https://eluq.fa.us2.oraclecloud.com/hcmRestApi/resources/latest/recruitingCEJobRequisitions?onlyData=true&expand=requisitionList.secondaryLocations&finder=findReqs;siteNumber=CX_2001,limit=200,offset=0,sortBy=POSTING_DATES_DESC"
    response: "items[0].TotalJobsCount (11217 on first page) and items[0].requisitionList[] with Title, PrimaryLocation (e.g. 'Layton, UT, United States'), secondaryLocations. Page with offset += 200; offsets seem capped at 10000."
    quirks: "keyword= search is fuzzy and empty keyword returns 0, so do NOT rely on keyword; page everything and filter PrimaryLocation containing ', UT'. 326 of the first 10000 were Utah (Layton 15, Ogden 13, Kaysville 12, Logan 9, Salt Lake City 67)."
  sites: [clearfield_ut, corinne_ut]
  search_terms:
    clearfield_ut: [Layton, Clearfield, Kaysville, Ogden, Roy]
    corinne_ut: [Logan, Brigham City, Ogden]
  verified: true
  total_postings_seen: 11217
  hourly_relevance: high
  careers_url: https://www.krogerfamilycareers.com/en/sites/CX_2001
  notes: "jobs.kroger.com redirects to krogerfamilycareers.com, an Oracle Recruiting Cloud site. Smith's postings are Kroger titles (CLERK, DEPT LEADER) in Utah cities. Layton Dairy MFG roles (Machine Operator, Maintenance Mechanic) appear under keyword 'Layton'."

