# Job-board sources for hourly "touch labor" employers near clearfield_ut and corinne_ut.
# Researched 2026-10-19 with live unauthenticated requests (User-Agent "intel_work-research/0.1").
# verified=true means the live request returned job data. total_postings_seen is the count in that response
# (often the whole board, not just Utah). Skipped on purpose: Walmart, Home Depot, Amazon (dedicated connectors).
# Generic note for every "other" entry: locations must be filtered client side by city/state text.

- company: Northrop Grumman
  platform: workday
  config: {tenant: ngc, wd: wd1, site: Northrop_Grumman_External_Site}
  sites: [clearfield_ut, corinne_ut]
  search_terms:
    clearfield_ut: [Clearfield, Layton, Ogden]
    corinne_ut: [Promontory, Corinne, Brigham City]
  verified: true
  total_postings_seen: 111
  hourly_relevance: high
  careers_url: https://jobs.northropgrumman.com/careers
  notes: "Clearfield search returned 111 (locationsText like 'United States-Utah-Clearfield'). searchText is fuzzy (Promontory 72, Corinne 75, Ogden 10), so filter on locationsText containing 'Utah'. The Eightfold-looking page at jobs.northropgrumman.com is not used; /api/pcsx/search 404s. Mix of engineering and manufacturing roles."

