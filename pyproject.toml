[project]
name = "touch-labor"
version = "0.1.0"
description = "Fact-finding on touch-labor supply at candidate manufacturing locations"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "requests>=2.32",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/touch_labor"]
